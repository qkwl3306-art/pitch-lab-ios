name: Build iOS
on:
  push:
    branches: [main, feat/native-music-tools, fix/iphone-layout-and-tab-crashes, feat/phrase-singing, feat/singing-audio, feat/continuous-self-paced-singing]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile simulator app and tests
        run: xcodebuild build-for-testing -project PitchLab.xcodeproj -scheme PitchLab -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for devices in d.values() for v in devices if "iPhone" in v["name"] and v["state"] != "unavailable"))')
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: xcodebuild test -project PitchLab.xcodeproj -scheme PitchLab -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PitchLab-test-diagnostics
          path: |
            TestResults.xcresult
            ~/Library/Logs/DiagnosticReports
      - name: Export simulator screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestScreenshots || true
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PitchLab-simulator-screenshots
          path: TestScreenshots
      - name: Build unsigned device app
        run: xcodebuild build -project PitchLab.xcodeproj -scheme PitchLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Verify launch screen and document declarations
        run: python3 -c 'import plistlib; p="build/Build/Products/Release-iphoneos/PitchLab.app/Info.plist"; data=plistlib.load(open(p,"rb")); assert "UILaunchScreen" in data, data.keys(); types=data["UTImportedTypeDeclarations"]; exts={ext for item in types for ext in item.get("UTTypeTagSpecification",{}).get("public.filename-extension",[])}; assert {"svp","musicxml","mxl","lrc"} <= exts, exts; docs={t for item in data["CFBundleDocumentTypes"] for t in item["LSItemContentTypes"]}; assert {"com.qkwl3306art.pitchlab.svp","public.midi-audio"} <= docs, docs'
      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p artifact/Payload
          cp -R build/Build/Products/Release-iphoneos/PitchLab.app artifact/Payload/
          cd artifact
          zip -qry PitchLab-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PitchLab-unsigned-ipa
          path: artifact/PitchLab-unsigned.ipa
