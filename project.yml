name: PitchLab
options:
  bundleIdPrefix: com.qkwl3306art
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
targets:
  PitchLab:
    type: application
    platform: iOS
    sources: [PitchLab]
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qkwl3306art.pitchlab
        PRODUCT_NAME: PitchLab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: PitchLab/Info.plist
      properties:
        CFBundleDisplayName: 音律实验室
        NSMicrophoneUsageDescription: 用于实时分析您的声音音高，录音只在设备上处理。
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.qkwl3306art.pitchlab.svp
            UTTypeDescription: Synthesizer V Project
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [svp]
          - UTTypeIdentifier: com.qkwl3306art.pitchlab.musicxml
            UTTypeDescription: MusicXML Score
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [musicxml]
          - UTTypeIdentifier: com.qkwl3306art.pitchlab.mxl
            UTTypeDescription: Compressed MusicXML Score
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mxl]
          - UTTypeIdentifier: com.qkwl3306art.pitchlab.lrc
            UTTypeDescription: LRC Lyrics
            UTTypeConformsTo: [public.plain-text, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [lrc]
  PitchLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PitchLabTests]
    dependencies:
      - target: PitchLab
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qkwl3306art.pitchlab.tests
        GENERATE_INFOPLIST_FILE: YES
  PitchLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PitchLabUITests]
    dependencies:
      - target: PitchLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qkwl3306art.pitchlab.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PitchLab:
    build:
      targets:
        PitchLab: all
        PitchLabTests: [test]
    test:
      targets:
        - PitchLabTests
        - PitchLabUITests
